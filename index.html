<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADG Petty Cash</title>


<style>

body {
    margin:0;
    padding:40px 20px;
    background:#f8f3eb;
    font-family:Arial, sans-serif;
    color:#4a3825;
}


.container {

    max-width:420px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(120,80,20,0.15);

}


h1 {

    text-align:center;
    color:#8b6418;
    margin-bottom:35px;

}


label {

    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:600;

}


input,
select,
textarea {


    width:100%;
    box-sizing:border-box;

    padding:12px;

    border:1px solid #d8b982;

    border-radius:12px;

    font-size:15px;

    background:#fffdf9;

}



textarea {

    height:100px;
    resize:none;

}



button {

    margin-top:25px;

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:#93691c;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}



button:hover {

    background:#765015;

}



#message {

    text-align:center;

    margin-top:20px;

    font-weight:bold;

}



</style>


</head>



<body>


<div class="container">


<h1>ADG Petty Cash</h1>



<form id="expenseForm">


<label>
Дата расхода *
</label>

<input 
type="date"
id="date"
required>



<label>
ФИО сотрудника *
</label>

<input
type="text"
id="name"
placeholder="Введите ФИО"
required>



<label>
Сумма *
</label>

<input
type="number"
id="amount"
step="0.01"
placeholder="0.00"
required>



<label>
Валюта *
</label>

<select id="currency">


<option value="AED">
AED
</option>


<option value="USD">
USD
</option>


<option value="EUR">
EUR
</option>


</select>




<label>
Проект *
</label>


<select id="project">


<option value="ADH">
ADH
</option>


<option value="ADM">
ADM
</option>


<option value="ADIP">
ADIP
</option>


</select>





<label>
Категория расхода *
</label>


<select id="category">


<option value="Materials / Материалы">
Materials / Материалы
</option>


<option value="Office expenses / Хоз. расходы">
Office expenses / Хоз. расходы
</option>


<option value="Travel expenses / Командировочные">
Travel expenses / Командировочные
</option>


<option value="Fuel / Transport">
Fuel / Transport
</option>


<option value="Meals / Представительские">
Meals / Представительские
</option>


<option value="Other">
Other
</option>


</select>





<label>
Комментарий
</label>


<textarea
id="comment"
placeholder="Описание расхода">
</textarea>





<label>
Фото чека / подтверждение оплаты *
</label>


<input
type="file"
id="file"
accept="image/*,.pdf"
required>




<button type="submit">
Отправить
</button>



</form>



<div id="message"></div>



</div>






<script>


const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwW0kIBlEEe1rDFRbJbG96hcSVbOP5kWJ3Db1_HpeDnuqGL58XDHkgGQ416uKLkkag/exec";




document
.getElementById("expenseForm")
.addEventListener(
"submit",
async function(e){


e.preventDefault();



const file =
document
.getElementById("file")
.files[0];



if(!file){

alert("Добавьте фото чека");

return;

}



const reader =
new FileReader();



reader.onload =
async function(){



const base64 =
reader.result.split(",")[1];



const data =
new URLSearchParams();




/*
ВАЖНО:
ПОРЯДОК ДОЛЖЕН СОВПАДАТЬ С Apps Script
*/


data.append(
"expenseDate",
document.getElementById("date").value
);



data.append(
"employeeName",
document.getElementById("name").value
);



data.append(
"amount",
document.getElementById("amount").value
);



data.append(
"currency",
document.getElementById("currency").value
);



data.append(
"project",
document.getElementById("project").value
);



data.append(
"category",
document.getElementById("category").value
);



data.append(
"comment",
document.getElementById("comment").value
);



data.append(
"fileBase64",
base64
);



data.append(
"fileName",
file.name
);



data.append(
"mimeType",
file.type
);




try {



await fetch(
WEB_APP_URL,
{

method:"POST",

body:data,

mode:"no-cors"

}

);




document.getElementById("message").innerHTML =
"✓ Расход успешно отправлен";



document
.getElementById("expenseForm")
.reset();



}
catch(error){



document.getElementById("message").innerHTML =
"Ошибка отправки данных";



}



};



reader.readAsDataURL(file);



});



</script>



</body>

</html>
